<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivia | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent scrolling if possible */
        }
        .split-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .split-image {
            flex: 1;
            background: url('assets/auth_bg.jpg') center/cover no-repeat;
            display: none;
        }
        @media (min-width: 900px) {
            .split-image {
                display: block;
            }
        }
        .split-form-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--c-bg);
            padding: 2rem;
            position: relative;
            overflow-y: auto;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .auth-title {
            font-size: 1.1rem;
            color: var(--c-text-muted);
            margin-bottom: 2rem;
        }
        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }
        .btn-google {
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-google:hover { background: #f5f5f5; }
        .btn-apple {
            background: #000;
            color: #fff;
            border: 1px solid #000;
        }
        .btn-apple:hover { background: #333; }
        [data-theme="dark"] .btn-google {
            background: #2a2a2a;
            color: #fff;
            border-color: #444;
        }
        [data-theme="dark"] .btn-google:hover { background: #333; }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--c-text-muted);
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--c-border);
        }
        .divider span {
            padding: 0 10px;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--c-text);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--c-border);
            border-radius: 8px;
            background: var(--c-surface);
            color: var(--c-text);
            font-family: var(--font-body);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--c-primary);
        }
        .btn-submit {
            background: var(--c-primary);
            color: var(--c-bg);
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .auth-footer {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--c-text-muted);
        }
        .auth-footer a {
            color: var(--c-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .theme-toggle-fixed {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--c-text);
            transition: 0.3s;
        }
        .theme-toggle-fixed:hover {
            background: var(--c-border);
        }
        .back-to-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: var(--c-text-muted);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.3s;
        }
        .back-to-home:hover {
            color: var(--c-primary);
        }
        /* Logo overrides for auth page */
        .auth-logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
    </style>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div class="split-layout">
        <div class="split-image"></div>
        <div class="split-form-container">
            <!-- Fixed Theme Toggle -->
            <button id="themeToggle" class="theme-toggle-fixed">
                <i class="fa-solid fa-sun light-icon"></i>
                <i class="fa-solid fa-moon dark-icon" style="display:none;"></i>
            </button>
            
            <!-- Back to Home -->
            <a href="index.html" class="back-to-home">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
            
            <div class="auth-card">
                <div class="auth-logo-wrapper">
                    <a href="index.html" class="logo">
                        <div class="logo-icon">
                            <i class="fa-solid fa-book-open"></i>
                            <i class="fa-solid fa-fire logo-flame"></i>
                        </div>
                        <div class="logo-text">
                            <h1>Archivia</h1>
                            <span>BOOKS &bull; NEWS &bull; IDEAS</span>
                        </div>
                    </a>
                </div>
                
                <p class="auth-title">Join a community of curious minds.</p>
                
                <button class="auth-btn btn-google">
                    <i class="fa-brands fa-google"></i> Continue with Google
                </button>
                <button class="auth-btn btn-apple">
                    <i class="fa-brands fa-apple"></i> Continue with Apple
                </button>
                
                <div class="divider">
                    <span>OR EMAIL</span>
                </div>
                
                <form>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="btn-submit">Create Account</button>
                </form>
                
                <div class="auth-footer">
                    Already have an account? <a href="login.html">Sign in here</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Minimal Script for Theme Toggle -->
    <script>
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                const html = document.documentElement;
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', newTheme);
                
                const lightIcon = themeBtn.querySelector('.light-icon');
                const darkIcon = themeBtn.querySelector('.dark-icon');
                
                if(newTheme === 'dark') {
                    lightIcon.style.display = 'none';
                    darkIcon.style.display = 'block';
                } else {
                    lightIcon.style.display = 'block';
                    darkIcon.style.display = 'none';
                }
            });
        }
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            once: true,
            offset: 100
        });
    </script>
</body>
</html>
